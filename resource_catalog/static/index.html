<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Resources | Teams Repost</title>
    <link rel="stylesheet" href="/resources/styles.css">
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Agents, Plugins &amp; Skills</h1>
        <p>Discover and share resources available to the team.</p>
      </div>
      <nav class="header-actions" aria-label="Primary navigation">
        <a class="button secondary" href="/">Reposts</a>
        <a class="button secondary" href="/reply-sync">Reply sync</a>
        <span id="authStatus" class="status">Checking sign-in</span>
        <a id="loginLink" class="button secondary" href="/auth/login?return_to=/resources">Sign in</a>
        <button id="logoutButton" class="button secondary hidden" type="button">Sign out</button>
        <button id="addResourceButton" class="button" type="button" disabled>Add resource</button>
      </nav>
    </header>

    <main>
      <div id="message" class="message hidden" role="status" aria-live="polite"></div>
      <section class="toolbar" aria-label="Resource filters">
        <div class="filter-control grow">
          <label for="searchInput">Search</label>
          <input id="searchInput" type="search" placeholder="Search by name, description, or author">
        </div>
        <div class="filter-control">
          <label for="typeFilter">Type</label>
          <select id="typeFilter">
            <option value="">All types</option>
            <option value="workspace_agent">Workspace agents</option>
            <option value="plugin">Plugins</option>
            <option value="skill">Skills</option>
          </select>
        </div>
        <button id="refreshButton" class="button secondary" type="button">Refresh</button>
      </section>

      <section class="summary" aria-live="polite">
        <span id="resultCount">0 resources</span>
        <span id="updateStatus" class="status">Waiting for resources</span>
      </section>
      <section id="resourceList" class="resource-list" aria-live="polite"></section>
    </main>

    <dialog id="resourceDialog" class="resource-dialog" aria-labelledby="dialogTitle">
      <form id="resourceForm">
        <div class="dialog-header">
          <div>
            <h2 id="dialogTitle">Add a resource</h2>
            <p>Share an agent, plugin, or skill.</p>
          </div>
          <button id="closeDialogButton" class="icon-button" type="button" aria-label="Close">×</button>
        </div>
        <div id="formError" class="form-error hidden" role="alert" tabindex="-1"></div>

        <label for="resourceUrl">URL</label>
        <input id="resourceUrl" name="url" type="url" required maxlength="4096" placeholder="https://...">

        <label for="resourceName">Name</label>
        <input id="resourceName" name="name" type="text" required maxlength="300">

        <label for="resourceDescription">Description</label>
        <textarea id="resourceDescription" name="description" required maxlength="5000" rows="5"></textarea>

        <label for="resourceType">Type</label>
        <select id="resourceType" name="type" required>
          <option value="workspace_agent">Workspace agent</option>
          <option value="plugin">Plugin</option>
          <option value="skill">Skill</option>
        </select>

        <label for="resourceAuthor">Author</label>
        <input id="resourceAuthor" name="author" type="text" required maxlength="300" autocomplete="name">

        <div class="dialog-actions">
          <button id="cancelDialogButton" class="button secondary" type="button">Cancel</button>
          <button id="submitResourceButton" class="button" type="submit">Submit</button>
        </div>
      </form>
    </dialog>

    <script src="/resources/app.js"></script>
  </body>
</html>
